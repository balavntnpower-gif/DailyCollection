<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Daily Collection – Hindu Lion Brothers</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background: #eef2f5; font-family: 'Segoe UI', sans-serif; padding: 10px; font-size: 13px; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { background: linear-gradient(135deg, #0f6b3a, #0a4f2c); color: white; border-radius: 20px; padding: 14px; text-align: center; margin-bottom: 15px; position: relative; }
        .coin-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.2); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; cursor: pointer; }
        .sync-status { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-size: 10px; background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 20px; }
        .sync-status.synced { background: #27ae60; }
        .sync-status.pending { background: #f39c12; }
        .sync-status.error { background: #e74c3c; }
        .header h1 { font-size: 1.3rem; font-weight: 600; }
        .header p { font-size: 0.7rem; opacity: 0.9; }
        .expiry-badge { position: absolute; right: 16px; top: 8px; background: rgba(0,0,0,0.5); padding: 4px 10px; border-radius: 20px; font-size: 0.65rem; font-weight: bold; }
        .expiry-badge.green { background: #27ae60; }
        .expiry-badge.yellow { background: #f39c12; color: #1a1a2e; }
        .expiry-badge.orange { background: #e67e22; }
        .expiry-badge.red { background: #e74c3c; }
        .tab-bar { display: flex; gap: 8px; margin-bottom: 15px; }
        .tab-btn { flex: 1; background: white; border: none; padding: 10px 0; border-radius: 40px; font-weight: bold; font-size: 0.85rem; cursor: pointer; }
        .tab-btn.active { background: #0f6b3a; color: white; }
        .loan-tab { background: #dc2626; color: white; }
        .loan-tab.active { background: #b91c1c; }
        .summary-row { display: flex; justify-content: space-between; align-items: center; background: white; border-radius: 20px; padding: 8px 16px; margin-bottom: 15px; }
        .cash-total { font-weight: 700; color: #0f6b3a; font-size: 1rem; }
        .loan-total { font-weight: 700; color: #dc2626; font-size: 1rem; }
        .create-btn-center { background: #0f6b3a; color: white; border: none; padding: 6px 18px; border-radius: 40px; font-weight: bold; font-size: 0.8rem; display: flex; align-items: center; gap: 5px; cursor: pointer; }
        .refresh-btn { background: #3498db; color: white; border: none; padding: 4px 12px; border-radius: 40px; font-size: 0.7rem; cursor: pointer; margin-left: 5px; }
        .backup-bar { display: flex; gap: 8px; margin-bottom: 15px; justify-content: center; flex-wrap: wrap; }
        .backup-btn, .restore-btn, .range-backup-btn { background: white; border: none; padding: 6px 12px; border-radius: 40px; font-weight: bold; font-size: 0.7rem; display: flex; align-items: center; gap: 5px; cursor: pointer; }
        .range-backup-btn { background: #e67e22; color: white; }
        .restore-btn { background: #eef2fa; }
        .date-list { background: white; border-radius: 20px; padding: 5px; margin-bottom: 12px; max-height: 180px; overflow-y: auto; }
        .date-item { padding: 8px 12px; border-bottom: 1px solid #eef2f5; cursor: pointer; font-weight: 500; font-size: 0.8rem; display: flex; justify-content: space-between; }
        .date-item .date-text { display: flex; align-items: center; gap: 6px; }
        .date-item .date-amount { font-weight: 600; color: #0f6b3a; }
        .loan-date-amount { color: #dc2626; }
        .active-date { background: #e0f2fe; border-left: 3px solid #2563eb; color: #1e40af; font-weight: 600; }
        .entry-table { background: white; border-radius: 20px; padding: 10px; margin-top: 6px; overflow-x: auto; display: none; }
        .entry-table.show { display: block; }
        table { width: 100%; border-collapse: collapse; font-size: 0.7rem; min-width: 580px; }
        th, td { padding: 6px 3px; text-align: left; border-bottom: 1px solid #eef2f5; }
        th { background: #f5f7fa; font-weight: 600; }
        .btn-icon { background: none; border: none; margin: 0 2px; cursor: pointer; font-size: 0.8rem; }
        .add-btn { background: #0f6b3a; color: white; border: none; padding: 8px; border-radius: 40px; margin-top: 8px; cursor: pointer; width: 100%; font-weight: bold; font-size: 0.75rem; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: flex-start; justify-content: center; z-index: 1000; overflow-y: auto; }
        .modal-card { background: white; width: 92%; max-width: 320px; border-radius: 24px; padding: 10px 14px; margin-top: 8vh; margin-bottom: 20px; }
        .modal-card h3 { font-size: 1rem; text-align: center; margin-bottom: 10px; }
        .form-group { margin-bottom: 6px; position: relative; }
        .form-group input, .form-group select { width: 100%; padding: 8px 12px; border-radius: 24px; border: 1px solid #ddd; font-size: 0.8rem; background: white; }
        .date-range-group { display: flex; gap: 8px; margin-bottom: 10px; }
        .date-range-group input { flex: 1; padding: 8px; border-radius: 24px; border: 1px solid #ddd; font-size: 0.75rem; }
        .suggestions-box { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid #ccc; border-radius: 16px; max-height: 150px; overflow-y: auto; z-index: 1100; }
        .suggestion-item { padding: 8px 12px; cursor: pointer; font-size: 0.8rem; }
        .suggestion-item:hover { background: #f0f0f0; }
        .modal-buttons { display: flex; justify-content: center; margin-top: 12px; margin-bottom: 6px; gap: 8px; flex-wrap: wrap; }
        .btn-save { background: #0f6b3a; color: white; border: none; padding: 8px 24px; border-radius: 40px; font-weight: bold; font-size: 0.85rem; cursor: pointer; }
        .btn-cancel { background: #95a5a6; color: white; border: none; padding: 8px 24px; border-radius: 40px; font-weight: bold; font-size: 0.85rem; cursor: pointer; }
        .note-grid { display: flex; flex-direction: column; gap: 5px; margin: 8px 0; }
        .note-row { display: grid; grid-template-columns: 40px 48px 55px; align-items: center; gap: 6px; }
        .note-label { font-weight: 600; font-size: 0.8rem; }
        .note-input { width: 48px; padding: 5px 0; border-radius: 16px; border: 1px solid #ccc; text-align: center; font-size: 0.7rem; }
        .note-value { text-align: right; font-weight: 600; color: #0f6b3a; font-size: 0.7rem; }
        .total-row { text-align: center; font-size: 0.85rem; font-weight: bold; margin: 5px 0; padding: 4px; background: #eef2fa; border-radius: 20px; }
        .reminder-popup { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; border-radius: 28px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); z-index: 2500; text-align: center; padding: 20px; width: 85%; max-width: 300px; border: 2px solid #0f6b3a; }
        .reminder-popup.hide { display: none; }
        .reminder-btn { background: #0f6b3a; color: white; border: none; padding: 10px 20px; border-radius: 40px; margin-top: 15px; font-weight: bold; cursor: pointer; width: 100%; }
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #1e3c72, #2a5298); z-index: 3000; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; padding: 30px 25px; border-radius: 28px; text-align: center; width: 85%; max-width: 320px; }
        .login-card h2 { color: #0f6b3a; margin-bottom: 5px; }
        .login-card .sub { font-size: 11px; color: #666; margin-bottom: 20px; }
        .login-card input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 40px; font-size: 14px; }
        .login-card button { width: 100%; padding: 12px; background: #0f6b3a; color: white; border: none; border-radius: 40px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .login-error { color: red; font-size: 12px; margin-top: 10px; }
        .login-loading { color: #0f6b3a; font-size: 12px; margin-top: 10px; }
        .network-status { font-size: 10px; margin-top: 8px; color: #888; }
        .toast { position: fixed; bottom: 20px; left: 20px; right: 20px; background: #1e2a32; color: white; padding: 10px; border-radius: 50px; text-align: center; font-size: 0.7rem; z-index: 1200; }
        .hide-app { display: none; }
    </style>
</head>
<body>

<div id="loginOverlay" class="login-overlay">
    <div class="login-card">
        <i class="fas fa-hand-holding-usd" style="font-size: 3rem; color: #0f6b3a;"></i>
        <h2>HLB FINANCE</h2>
        <div class="sub">Powered By Hindu Lion Brothers</div>
        <input type="text" id="loginId" placeholder="ID" autocomplete="off">
        <input type="password" id="loginPassword" placeholder="Password" autocomplete="off">
        <button id="loginBtn">LOGIN</button>
        <div id="loginError" class="login-error"></div>
        <div id="loginLoading" class="login-loading"></div>
        <div id="networkStatus" class="network-status"></div>
    </div>
</div>

<div id="mainApp" class="hide-app">
<div class="container">
    <div class="header">
        <div class="coin-icon" id="noteCountingIcon">🪙</div>
        <div id="expiryBadge" class="expiry-badge"></div>
        <div id="syncStatus" class="sync-status">🔄</div>
        <h1>Daily Collection</h1>
        <p>Powered By | Hindu Lion Brothers</p>
    </div>

    <div class="tab-bar">
        <button class="tab-btn active" id="tabCashBtn">💰 नगद प्राप्त</button>
        <button class="tab-btn loan-tab" id="tabLoanBtn">📊 लोन दिया गया</button>
    </div>

    <div class="summary-row">
        <span class="cash-total" id="cashTotalAmount">₹0</span>
        <button class="create-btn-center" id="createDateBtn"><i class="fas fa-calendar-plus"></i> Create Date</button>
        <button class="refresh-btn" id="refreshDataBtn"><i class="fas fa-sync-alt"></i> Sync</button>
        <span class="loan-total" id="loanTotalAmount">₹0</span>
    </div>

    <div class="backup-bar">
        <button class="backup-btn" id="jsonBackupBtn"><i class="fas fa-download"></i> JSON</button>
        <button class="backup-btn" id="excelBackupBtn"><i class="fas fa-file-excel"></i> Excel</button>
        <button class="range-backup-btn" id="rangeBackupBtn"><i class="fas fa-calendar-range"></i> Date Range Excel</button>
        <button class="restore-btn" id="restoreBtn"><i class="fas fa-upload"></i> Restore</button>
        <input type="file" id="restoreFileInput" accept=".json" style="display:none;">
    </div>

    <div id="cashSection">
        <div class="date-list" id="cashDatesList"></div>
        <div class="entry-table" id="cashEntriesTable"></div>
    </div>

    <div id="loanSection" style="display:none;">
        <div class="date-list" id="loanDatesList"></div>
        <div class="entry-table" id="loanEntriesTable"></div>
    </div>
</div>
</div>

<div id="dateRangeModal" class="modal"><div class="modal-card"><h3>Date Range Excel Backup</h3><div class="date-range-group"><input type="date" id="startDate"><input type="date" id="endDate"></div><div class="modal-buttons"><button id="exportRangeBtn" class="btn-save">Export Excel</button><button id="closeRangeModalBtn" class="btn-cancel">Cancel</button></div></div></div>
<div id="reminderPopup" class="reminder-popup hide"><i class="fas fa-bell"></i><h3>Backup Reminder</h3><p>कृपया अभी JSON Backup लें।</p><button id="reminderBackupBtn" class="reminder-btn">JSON Backup Now</button></div>
<div id="cashModal" class="modal"><div class="modal-card"><h3>नई प्रविष्टि</h3><form id="cashForm"><input type="hidden" id="cashId"><div class="form-group"><input id="cashName" placeholder="नाम" required></div><div class="form-group"><input type="number" id="cashAmount" placeholder="रकम" required></div><div class="form-group"><input id="cashDate" placeholder="तारीख (dd/mm/yyyy)" required></div><div class="form-group"><select id="cashMode"><option>Cash</option><option>UPI</option><option>Bank</option></select></div><div class="form-group"><input id="cashRemark" placeholder="Remark"></div><div class="modal-buttons"><button type="submit" class="btn-save">सेव करें</button></div></form></div></div>
<div id="loanModal" class="modal"><div class="modal-card"><h3>नया लोन</h3><form id="loanForm"><input type="hidden" id="loanId"><div class="form-group"><input id="loanName" placeholder="नाम" required></div><div class="form-group"><input id="loanAddress" placeholder="पता" required></div><div class="form-group"><input type="number" id="loanAmount" placeholder="लोन रकम" required></div><div class="form-group"><input id="loanDate" placeholder="तारीख (dd/mm/yyyy)" required></div><div class="form-group"><select id="loanPeriod"><option value="month">Month (%)</option><option value="60">60 दिन</option><option value="80">80 दिन</option><option value="100">100 दिन</option><option value="120">120 दिन</option></select></div><div id="percentDiv"><div class="form-group"><input type="number" id="interestPercent" placeholder="ब्याज (%)" value="10"></div></div><div class="form-group"><input id="loanRemark" placeholder="Remark"></div><div class="modal-buttons"><button type="submit" class="btn-save">सेव करें</button></div></form></div></div>
<div id="noteModal" class="modal"><div class="modal-card"><h3>Note Counting</h3><div class="total-row">Total: ₹<span id="noteTotal">0</span></div><div class="note-grid" id="noteGrid"></div><div class="modal-buttons"><button id="resetNotesBtn">Reset</button><button id="saveNotesBtn">सेव करें</button><button id="closeNoteModalBtn">बंद करें</button></div></div></div>

<script>
    const SUPABASE_URL = "https://rybouhjcxfjnilsunihd.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5Ym91aGpjeGZqbmlsc3VuaWhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMzY1NzQsImV4cCI6MjA5NDkxMjU3NH0.SXqopYeLqvukHZkBo2tmhI4o6f-lJYCxn2Tbud3_nms";
    
    let supabaseClient = null;
    let db;
    let cashData = [], loanData = [];
    let cashDatesSet = new Set(), loanDatesSet = new Set();
    let selectedCashDate = null, selectedLoanDate = null;
    let noteCounts = { 500: "", 200: "", 100: "", 50: "", 20: "", 10: "", 5: "" };
    const denoms = [500, 200, 100, 50, 20, 10, 5];
    let currentActiveTab = "cash";
    let currentUser = null;
    const GITHUB_USERS_URL = "https://balavntnpower-gif.github.io/DailyCollection/users.json";
    
    function initSupabase() {
        if (typeof supabase === 'undefined') { setTimeout(initSupabase, 500); return; }
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        console.log("Supabase initialized");
        updateSyncStatus('synced', '✅');
    }
    
    function updateSyncStatus(status, msg) {
        let el = document.getElementById('syncStatus');
        if(el) { el.className = 'sync-status ' + status; el.innerHTML = msg || (status==='synced'?'✅':status==='pending'?'⏳':'❌'); }
    }
    
    function showToast(msg) { let t=document.createElement('div'); t.className='toast'; t.innerText=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2000); }
    
    async function save(store, item) {
        let tx = db.transaction(store, "readwrite");
        tx.objectStore(store).put(item);
        await new Promise(r => tx.oncomplete = r);
        
        if(navigator.onLine && supabaseClient && currentUser) {
            try {
                let table = store === 'cash' ? 'daily_cash' : (store === 'loan' ? 'daily_loan' : 'daily_notes');
                let supItem = {};
                if(store === 'cash') {
                    supItem = { id: item.id, name: item.name, amount: item.amount, date: item.date, mode: item.mode || 'Cash', remark: item.remark || '', userid: item.userId || currentUser.id, username: item.userName || currentUser.name };
                } else if(store === 'loan') {
                    supItem = { id: item.id, name: item.name, address: item.address || '', loanamount: item.loanAmount, date: item.date, period: item.period, interest: item.interest || null, remark: item.remark || '', userid: item.userId || currentUser.id, username: item.userName || currentUser.name };
                } else {
                    supItem = { id: item.id, counts: item.counts, userid: currentUser.id };
                }
                console.log("Saving:", table, supItem);
                const { error } = await supabaseClient.from(table).upsert(supItem, { onConflict: 'id' });
                if(error) { console.error("Save error:", error); showToast("Save failed: "+error.message); updateSyncStatus('error','❌'); }
                else { console.log("Saved successfully"); showToast("Saved to cloud"); updateSyncStatus('synced','✅'); }
            } catch(e) { console.error(e); }
        }
    }
    
    async function saveToIndexedDBOnly(store, item) {
        let tx = db.transaction(store, "readwrite");
        tx.objectStore(store).put(item);
        await new Promise(r => tx.oncomplete = r);
    }
    
    async function del(store, id) {
        let tx = db.transaction(store, "readwrite");
        tx.objectStore(store).delete(id);
        await new Promise(r => tx.oncomplete = r);
        if(navigator.onLine && supabaseClient && currentUser) {
            let table = store === 'cash' ? 'daily_cash' : (store === 'loan' ? 'daily_loan' : 'daily_notes');
            await supabaseClient.from(table).delete().eq('id', id);
        }
    }
    
    async function getAll(store) {
        return new Promise(r => { let tx = db.transaction(store, "readonly"); tx.objectStore(store).getAll().onsuccess = e => r(e.target.result || []); });
    }
    
    async function syncFromSupabase() {
        if(!supabaseClient || !currentUser) return false;
        updateSyncStatus('pending','⏳');
        showToast("Syncing...");
        try {
            const { data: cashDB, error: cashErr } = await supabaseClient.from('daily_cash').select('*').eq('userid', currentUser.id);
            if(cashErr) console.error("Cash error:", cashErr);
            else if(cashDB && cashDB.length) { for(let c of cashDB) { await saveToIndexedDBOnly("cash", { id: c.id, name: c.name, amount: c.amount, date: c.date, mode: c.mode, remark: c.remark||'', userId: c.userid, userName: c.username }); } showToast(`Downloaded ${cashDB.length} cash`); }
            
            const { data: loanDB, error: loanErr } = await supabaseClient.from('daily_loan').select('*').eq('userid', currentUser.id);
            if(loanErr) console.error("Loan error:", loanErr);
            else if(loanDB && loanDB.length) { for(let l of loanDB) { await saveToIndexedDBOnly("loan", { id: l.id, name: l.name, address: l.address||'', loanAmount: l.loanamount, date: l.date, period: l.period, interest: l.interest, remark: l.remark||'', userId: l.userid, userName: l.username }); } }
            
            const { data: notesDB } = await supabaseClient.from('daily_notes').select('*').eq('userid', currentUser.id).maybeSingle();
            if(notesDB) { noteCounts = notesDB.counts; await saveToIndexedDBOnly("notes", { id: `noteData_${currentUser.id}`, counts: noteCounts }); }
            
            await loadAll();
            updateSyncStatus('synced','✅');
            showToast("Sync complete");
            return true;
        } catch(e) { console.error(e); updateSyncStatus('error','❌'); showToast("Sync failed"); return false; }
    }
    
    function openDB() {
        return new Promise((resolve, reject) => {
            let req = indexedDB.open("HinduLionDailyCollectionDB", 2);
            req.onupgradeneeded = e => { let db = e.target.result; if(!db.objectStoreNames.contains("cash")) db.createObjectStore("cash", {keyPath:"id", autoIncrement:true}); if(!db.objectStoreNames.contains("loan")) db.createObjectStore("loan", {keyPath:"id", autoIncrement:true}); if(!db.objectStoreNames.contains("notes")) db.createObjectStore("notes", {keyPath:"id"}); };
            req.onsuccess = e => { db = e.target.result; resolve(db); };
            req.onerror = e => reject(e);
        });
    }
    
    function formatAmount(amt) { return amt % 1 === 0 ? amt.toString() : amt.toFixed(2); }
    function getToday() { let d=new Date(); return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`; }
    function getTodayForFilename() { let d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
    function escape(str){ return String(str||"").replace(/[&<>]/g, m=> m==='&'?'&amp;': m==='<'?'&lt;': '&gt;'); }
    
    function updateExpiryBadge(expiryDate) {
        let badge = document.getElementById("expiryBadge");
        if(!expiryDate) { badge.style.display = "none"; return; }
        let today = new Date(), expiry = new Date(expiryDate);
        today.setHours(0,0,0,0); expiry.setHours(0,0,0,0);
        let diff = Math.ceil((expiry - today) / (1000*60*60*24));
        badge.style.display = "block";
        if(diff<=0) badge.innerHTML = "Expired";
        else if(diff<=3) badge.innerHTML = `${diff} days left`;
        else if(diff<=7) badge.innerHTML = `${diff} days left`;
        else badge.innerHTML = `${diff} days left`;
    }
    
    async function loadAll() {
        if(!db) return;
        let allCash = await getAll("cash");
        let allLoan = await getAll("loan");
        if(currentUser && currentUser.role !== 'admin') {
            cashData = allCash.filter(c => c.userId === currentUser.id);
            loanData = allLoan.filter(l => l.userId === currentUser.id);
        } else { cashData = allCash; loanData = allLoan; }
        cashDatesSet = new Set(cashData.map(c => c.date));
        loanDatesSet = new Set(loanData.map(l => l.date));
        updateTotals();
        renderCashDates();
        renderLoanDates();
        let today = getToday();
        if(currentActiveTab === "cash") {
            if(selectedCashDate && cashDatesSet.has(selectedCashDate)) renderCashEntries();
            else if(cashDatesSet.has(today)) { selectedCashDate = today; renderCashEntries(); renderCashDates(); }
            else if(cashDatesSet.size) { selectedCashDate = Array.from(cashDatesSet)[0]; renderCashEntries(); renderCashDates(); }
            else { selectedCashDate = null; document.getElementById("cashEntriesTable").classList.remove("show"); }
        } else {
            if(selectedLoanDate && loanDatesSet.has(selectedLoanDate)) renderLoanEntries();
            else if(loanDatesSet.has(today)) { selectedLoanDate = today; renderLoanEntries(); renderLoanDates(); }
            else if(loanDatesSet.size) { selectedLoanDate = Array.from(loanDatesSet)[0]; renderLoanEntries(); renderLoanDates(); }

    async function checkLogin() {
        let id = document.getElementById("loginId").value.trim();
        let password = document.getElementById("loginPassword").value.trim();
        if(!id || !password) { document.getElementById("loginError").innerText = "Fill both fields"; return; }
        if(id.toLowerCase() === 'hindu' && password === 'Lion') {
            currentUser = { id: 'hindu', name: 'हिंदू', role: 'admin', expiry: null };
            localStorage.setItem("currentUser", JSON.stringify(currentUser));
            document.getElementById("loginOverlay").style.display = "none";
            document.getElementById("mainApp").classList.remove("hide-app");
            updateExpiryBadge(null);
            await openDB();
            await loadAll();
            await loadNotes();
            await syncFromSupabase();
            checkBackupReminder();
            return;
        }
        document.getElementById("loginLoading").innerText = "Verifying...";
        let usersData = await fetchUsersFromGitHub();
        if(!usersData || !usersData.users) { document.getElementById("loginError").innerText = "Unable to verify"; document.getElementById("loginLoading").innerText = ""; return; }
        let user = usersData.users[id];
        if(!user || user.password !== password) { document.getElementById("loginError").innerText = "Invalid ID or Password"; document.getElementById("loginLoading").innerText = ""; return; }
        let today = new Date().toISOString().slice(0,10);
        if(user.expiry < today) { document.getElementById("loginError").innerText = "License Expired"; document.getElementById("loginLoading").innerText = ""; return; }
        currentUser = { id: id, name: user.name, role: user.role, expiry: user.expiry };
        localStorage.setItem("currentUser", JSON.stringify(currentUser));
        document.getElementById("loginOverlay").style.display = "none";
        document.getElementById("mainApp").classList.remove("hide-app");
        updateExpiryBadge(currentUser.expiry);
        await openDB();
        await loadAll();
        await loadNotes();
        await syncFromSupabase();
        checkBackupReminder();
        document.getElementById("loginLoading").innerText = "";
    }
    
    function checkSavedLogin() {
        let saved = localStorage.getItem("currentUser");
        if(saved) {
            let user = JSON.parse(saved);
            if(user.id === 'hindu') {
                currentUser = user;
                document.getElementById("loginOverlay").style.display = "none";
                document.getElementById("mainApp").classList.remove("hide-app");
                updateExpiryBadge(null);
                openDB().then(() => { loadAll(); loadNotes(); if(supabaseClient) syncFromSupabase(); checkBackupReminder(); });
                return true;
            }
            let today = new Date().toISOString().slice(0,10);
            if(user.expiry >= today) {
                currentUser = user;
                document.getElementById("loginOverlay").style.display = "none";
                document.getElementById("mainApp").classList.remove("hide-app");
                updateExpiryBadge(currentUser.expiry);
                openDB().then(() => { loadAll(); loadNotes(); if(supabaseClient) syncFromSupabase(); checkBackupReminder(); });
                return true;
            } else { localStorage.removeItem("currentUser"); }
        }
        return false;
    }

    if(!checkSavedLogin()) { document.getElementById("loginOverlay").style.display = "flex"; document.getElementById("mainApp").classList.add("hide-app"); }
</script>
</body>
