        /* 10 Rupee Coin Styles - Dashboard Icon */
        .coin-dashboard-wrapper {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            cursor: pointer;
            z-index: 10;
        }
        
        .coin-dashboard-wrapper .coin-outer {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg,
                #c9982e, #f5d76e, #c9982e, #e8c547, #b8860b,
                #f5d76e, #c9982e, #e8c547, #b8860b, #f5d76e,
                #c9982e, #e8c547, #b8860b, #c9982e
            );
            box-shadow: 0 0 0 2px #a07618, 0 4px 10px rgba(0,0,0,0.3), inset 0 0 10px rgba(0,0,0,0.1);
        }
        
        .coin-dashboard-wrapper .coin-outer::before {
            content: '';
            position: absolute;
            inset: 4px;
            border-radius: 50%;
            background: repeating-conic-gradient(#d4a830 0deg 3deg, #b8860b 3deg 6deg);
            mask: radial-gradient(circle, transparent 56%, black 57%, black 63%, transparent 64%);
            -webkit-mask: radial-gradient(circle, transparent 56%, black 57%, black 63%, transparent 64%);
        }
        
        .coin-dashboard-wrapper .coin-inner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: radial-gradient(circle at 38% 35%, #f0f0f0 0%, #d9d9d9 25%, #c0c0c0 50%, #a8a8a8 75%, #909090 100%);

            flex-direction: column;
            justify-content: center;
            align-items: center;

        .coin-dashboard-wrapper .rupee-symbol {

            font-size: 18px;
            font-weight: 700;
            color: #3a3a3a;
            line-height: 1;

                        id: item.id, 
                        name: item.name, 
                        amount: item.amount, 
                        date: item.date, 
                        mode: item.mode || 'Cash', 
                        remark: item.remark || '', 
                        userid: item.userId || currentUser.id, 
                        username: item.userName || currentUser.name 
                    };
                } else if(store === 'loan') {
                    supItem = { 
                        id: item.id, 
                        name: item.name, 
                        address: item.address || '', 
                        loanamount: item.loanAmount, 
                        date: item.date, 
                        period: item.period, 
                        interest: item.interest || null, 
                        remark: item.remark || '', 
                        userid: item.userId || currentUser.id, 
                        username: item.userName || currentUser.name 
                    };
                } else {
                    supItem = { id: item.id, counts: item.counts, userid: currentUser.id };
                }
                
                const { error } = await supabaseClient.from(table).upsert(supItem, { onConflict: 'id' });
                if(error) { 
                    console.error("Save error:", error); 
                    showToast("⚠️ Saved locally only");
                    updateSyncStatus('error','❌');
                } else { 
                    console.log("Saved to cloud successfully"); 
                    showToast("✅ Saved to cloud");
                    updateSyncStatus('synced','✅');
                }
            } catch(e) { 
                console.error(e);
                updateSyncStatus('error','❌');
            }
        } else {
            showToast("📱 Offline mode - saved locally");
            updateSyncStatus('pending','⏳');
        }
    }
    
    async function syncFromSupabase(forceRefresh = false) {
        if(!supabaseClient || !currentUser) return false;
        updateSyncStatus('pending','⏳');
        showToast("🔄 Syncing from cloud...");
        
        try {
            if(forceRefresh && db) {
                let tx = db.transaction(["cash", "loan"], "readwrite");
                tx.objectStore("cash").clear();
                tx.objectStore("loan").clear();
                await new Promise(r => tx.oncomplete = r);
                console.log("Local data cleared");
            }
            
            const { data: cashDB, error: cashErr } = await supabaseClient
                .from('daily_cash')
                .select('*')
                .eq('userid', currentUser.id);
                
            if(cashErr) console.error("Cash error:", cashErr);
            else if(cashDB && cashDB.length) {
                for(let c of cashDB) {
                    await saveToIndexedDBOnly("cash", { 
                        id: c.id, 
                        name: c.name, 
                        amount: c.amount, 
                        date: c.date, 
                        mode: c.mode, 
                        remark: c.remark||'', 
                        userId: c.userid, 
                        userName: c.username 
                    });
                }
                showToast(`📥 Downloaded ${cashDB.length} cash records`);
            }
            
            const { data: loanDB, error: loanErr } = await supabaseClient
                .from('daily_loan')
                .select('*')
                .eq('userid', currentUser.id);
                
            if(loanErr) console.error("Loan error:", loanErr);
            else if(loanDB && loanDB.length) {
                for(let l of loanDB) {
                    await saveToIndexedDBOnly("loan", { 
                        id: l.id, 
                        name: l.name, 
                        address: l.address||'', 
                        loanAmount: l.loanamount, 
                        date: l.date, 
                        period: l.period, 
                        interest: l.interest, 
                        remark: l.remark||'', 
                        userId: l.userid, 
                        userName: l.username 
                    });
                }
            }
            
            const { data: notesDB } = await supabaseClient
                .from('daily_notes')
                .select('*')
                .eq('userid', currentUser.id)
                .maybeSingle();
                
            if(notesDB) {
                noteCounts = notesDB.counts;
                await saveToIndexedDBOnly("notes", { id: `noteData_${currentUser.id}`, counts: noteCounts });
            }
            
            await loadAll();
            updateSyncStatus('synced','✅');
            showToast("✅ Sync complete");
            return true;
            
        } catch(e) { 
            console.error(e); 
            updateSyncStatus('error','❌'); 
            showToast("❌ Sync failed");
            return false;
        }
    }
    
    function openDB() {
        return new Promise((resolve, reject) => {
            let req = indexedDB.open("HinduLionDailyCollectionDB", 3);
            req.onupgradeneeded = e => { 
                let db = e.target.result; 
                if(!db.objectStoreNames.contains("cash")) db.createObjectStore("cash", {keyPath:"id"});
                if(!db.objectStoreNames.contains("loan")) db.createObjectStore("loan", {keyPath:"id"});
                if(!db.objectStoreNames.contains("notes")) db.createObjectStore("notes", {keyPath:"id"});
            };
            req.onsuccess = e => { db = e.target.result; resolve(db); };
            req.onerror = e => reject(e);
        });
    }
    
    async function getAll(store) {
        return new Promise(r => { 
            let tx = db.transaction(store, "readonly"); 
            tx.objectStore(store).getAll().onsuccess = e => r(e.target.result || []); 
        });
    }

    function getTodayForFilename() { let d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
    function escape(str){ return String(str||"").replace(/[&<>]/g, m=> m==='&'?'&amp;': m==='<'?'&lt;': '&gt;'); }
    
    function updateExpiryBadge(expiryDate) {
        let badge = document.getElementById("expiryBadge");
        if(!expiryDate) { badge.style.display = "none"; return; }
        let today = new Date(), expiry = new Date(expiryDate);
        today.setHours(0,0,0,0); expiry.setHours(0,0,0,0);
        let diff = Math.ceil((expiry - today) / (1000*60*60*24));
        badge.style.display = "block";
        if(diff<=0) badge.innerHTML = "Expired";
        else if(diff<=3) badge.innerHTML = `🚨 ${diff} days left`;
        else if(diff<=7) badge.innerHTML = `🔴 ${diff} days left`;
        else if(diff<=15) badge.innerHTML = `⚠️ ${diff} days left`;
        else badge.innerHTML = `✅ ${diff} days left`;
    }

            cashData = allCash.filter(c => c.userId === currentUser.id);

        renderLoanDates();

            if(cashDatesSet.has(today)) {

                selectedCashDate = Array.from(cashDatesSet)[0];
            } else {

        let cashSheet = filteredCash.map(c=>({Type:"Cash", Name:c.name, Amount:c.amount, Date:c.date, Mode:c.mode, Remark:c.remark||""}));
        let loanSheet = filteredLoan.map(l=>({Type:"Loan", Name:l.name, Address:l.address, "Loan Amount":l.loanAmount, "Return Amount":(l.period==='month'?"":(l.loanAmount*1.2).toFixed(2)), "Per Day":(l.period!=='month'?((l.loanAmount*1.2)/l.period).toFixed(0):""), "Period/Interest":l.period==='month'?`${l.interest}%`:`${l.period} days`, Date:l.date, Remark:l.remark||""}));
        let ws1 = XLSX.utils.json_to_sheet(cashSheet), ws2 = XLSX.utils.json_to_sheet(loanSheet);
        let wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws1, "Cash");

        let a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `backup_${currentUser.id}_${start}_to_${end}.xlsx`;
        a.click();
        URL.revokeObjectURL(a.href);

            } else if(d === 5) {
                iconHtml = '<div class="note-icon coin-5">5️⃣</div>';
            } else if(d >= 100) {
                iconHtml = `<div class="note-icon" style="background: linear-gradient(135deg, #27ae60, #1e8449);">💰</div>`;
            } else {
                iconHtml = `<div class="note-icon" style="background: linear-gradient(135deg, #f39c12, #e67e22);">🪙</div>`;
            }
            
            html += `
                <div class="note-row">
                    ${iconHtml}
                    <div class="note-details">
                        <span class="note-label">₹${d}</span>
                        <input type="number" class="note-input" data-denom="${d}" value="${count}" placeholder="0" min="0" step="1">
                        <span class="note-value">₹${value.toLocaleString('en-IN')}</span>
                    </div>
                </div>`;
        }
        container.innerHTML = html;
        document.getElementById("noteTotal").innerText = calculateNoteTotal().toLocaleString('en-IN');
        document.querySelectorAll(".note-input").forEach(inp => {
            inp.addEventListener("input", (e) => {
                let denom = parseInt(e.target.dataset.denom);
                let val = e.target.value === "" ? "" : parseInt(e.target.value);
                if(isNaN(val)) val = "";
                noteCounts[denom] = val === "" ? "" : val;
                let valNum = (val === "" || isNaN(val)) ? 0 : val;
                let vs = e.target.parentElement.querySelector(".note-value");
                if(vs) vs.innerText = `₹${(valNum * denom).toLocaleString('en-IN')}`;
                document.getElementById("noteTotal").innerText = calculateNoteTotal().toLocaleString('en-IN');
            });
        });
    }
    
    function resetNoteFields() { for(let d of denoms) noteCounts[d] = ""; renderNotePopup(); }
    
    document.getElementById("noteCountingIcon").onclick = () => { renderNotePopup(); document.getElementById("noteModal").style.display = "flex"; };
    document.getElementById("resetNotesBtn").onclick = () => { resetNoteFields(); };
    document.getElementById("saveNotesBtn").onclick = async() => { await saveNotesToDB(); document.getElementById("noteModal").style.display = "none"; };
    document.getElementById("closeNoteModalBtn").onclick = () => document.getElementById("noteModal").style.display = "none";
    
    async function getAllData() { return { cash: cashData, loan: loanData, cashDates: Array.from(cashDatesSet), loanDates: Array.from(loanDatesSet) }; }
    function downloadFile(content, filename, type) { let blob = new Blob([content], {type}); let a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; a.click(); URL.revokeObjectURL(a.href); showToast(`📁 ${filename} डाउनलोड हुआ`); }
    
    document.getElementById("jsonBackupBtn").onclick = async() => { let data = await getAllData(); let ds = getTodayForFilename(); downloadFile(JSON.stringify(data, null, 2), `backup_${currentUser.id}_${ds}.json`, "application/json"); };
    document.getElementById("excelBackupBtn").onclick = async() => {
        let cashSheet = cashData.map(c=>({Type:"Cash", Name:c.name, Amount:c.amount, Date:c.date, Mode:c.mode, Remark:c.remark||""}));
        let loanSheet = loanData.map(l=>({Type:"Loan", Name:l.name, Address:l.address, "Loan Amount":l.loanAmount, "Return Amount":(l.period==='month'?"":(l.loanAmount*1.2).toFixed(2)), "Per Day":(l.period!=='month'?((l.loanAmount*1.2)/l.period).toFixed(0):""), "Period/Interest":l.period==='month'?`${l.interest}%`:`${l.period} days`, Date:l.date, Remark:l.remark||""}));
        let ws1 = XLSX.utils.json_to_sheet(cashSheet), ws2 = XLSX.utils.json_to_sheet(loanSheet);
        let wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws1, "Cash");
        XLSX.utils.book_append_sheet(wb, ws2, "Loan");
        let buf = XLSX.write(wb, {bookType:"xlsx", type:"array"});
        let blob = new Blob([buf], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
        let a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `backup_${currentUser.id}_${getTodayForFilename()}.xlsx`;
        a.click();
        URL.revokeObjectURL(a.href);
        showToast("📊 Excel Backup डाउनलोड हुआ");
    };
    
    document.getElementById("restoreBtn").onclick = () => document.getElementById("restoreFileInput").click();
    document.getElementById("restoreFileInput").addEventListener("change", async(e) => {
        let file = e.target.files[0]; if(!file) return; let text = await file.text();
        try { let data = JSON.parse(text); if(data.cash) for(let c of data.cash) { c.userId = currentUser.id; await save("cash", c); } if(data.loan) for(let l of data.loan) { l.userId = currentUser.id; await save("loan", l); } await loadAll(); showToast("✅ Restore सफल"); } catch(e) { alert("Invalid JSON"); } e.target.value = "";
    });
    
    document.getElementById("refreshDataBtn").onclick = async () => { await syncFromSupabase(false); };
    document.getElementById("hardRefreshBtn").onclick = async () => { 
        if(confirm("⚠️ This will clear local data and fetch fresh from cloud. Continue?")) {
            await syncFromSupabase(true);
        }
    };
    
    function checkBackupReminder() {
        if(!currentUser) return;
        let now = new Date();
        let hour = now.getHours();
        let dateStr = now.toDateString();
        let last3PM = localStorage.getItem(`last3PM_${currentUser.id}`);
        let last8PM = localStorage.getItem(`last8PM_${currentUser.id}`);
        if(hour >= 15 && last3PM !== dateStr) { document.getElementById("reminderPopup").classList.remove("hide"); localStorage.setItem(`last3PM_${currentUser.id}`, dateStr); }
        else if(hour >= 20 && last8PM !== dateStr) { document.getElementById("reminderPopup").classList.remove("hide"); localStorage.setItem(`last8PM_${currentUser.id}`, dateStr); }
    }
    async function doJSONBackupAndClose() { let data = await getAllData(); let jsonStr = JSON.stringify(data, null, 2); let blob = new Blob([jsonStr], {type:"application/json"}); let a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `backup_${currentUser.id}_${getTodayForFilename()}.json`; a.click(); URL.revokeObjectURL(a.href); document.getElementById("reminderPopup").classList.add("hide"); showToast("📁 JSON Backup डाउनलोड हुआ"); }
    if(document.getElementById("reminderBackupBtn")) document.getElementById("reminderBackupBtn").onclick = doJSONBackupAndClose;
    
    async function fetchUsersFromGitHub() {
        document.getElementById("networkStatus").innerText = "🔄 Connecting...";
        try {
            let response = await fetch(GITHUB_USERS_URL);
            if(!response.ok) throw new Error();
            let data = await response.json();
            localStorage.setItem("githubUsersCache", JSON.stringify({ data, timestamp: Date.now() }));
            document.getElementById("networkStatus").innerText = "✅ Online";
            setTimeout(() => { document.getElementById("networkStatus").innerText = ""; }, 2000);
            return data;
        } catch(e) {
            let cached = localStorage.getItem("githubUsersCache");
            if(cached) { let cacheData = JSON.parse(cached); document.getElementById("networkStatus").innerHTML = "📡 Offline mode"; setTimeout(() => { document.getElementById("networkStatus").innerHTML = ""; }, 3000); return cacheData.data; }
            document.getElementById("networkStatus").innerText = "❌ No internet!";
            return null;
        }
    }
    
    async function checkLogin() {
        let id = document.getElementById("loginId").value.trim();
        let password = document.getElementById("loginPassword").value.trim();
        if(!id || !password) { document.getElementById("loginError").innerText = "❌ ID और Password दोनों भरें!"; return; }
        if(id.toLowerCase() === 'hindu' && password === 'Lion') {
            currentUser = { id: 'hindu', name: 'हिंदू', role: 'admin', expiry: null };
            localStorage.setItem("currentUser", JSON.stringify(currentUser));
            document.getElementById("loginOverlay").style.display = "none";
            document.getElementById("mainApp").classList.remove("hide-app");
            updateExpiryBadge(null);
            await openDB();
            await loadAll();
            await loadNotes();
            await syncFromSupabase(true);
            checkBackupReminder();
            return;
        }
        document.getElementById("loginLoading").innerText = "⏳ Verifying...";
        let usersData = await fetchUsersFromGitHub();
        if(!usersData || !usersData.users) { document.getElementById("loginError").innerText = "❌ Unable to verify! Check internet."; document.getElementById("loginLoading").innerText = ""; return; }
        let user = usersData.users[id];
        if(!user || user.password !== password) { document.getElementById("loginError").innerText = "❌ Invalid ID or Password!"; document.getElementById("loginLoading").innerText = ""; return; }
        let today = new Date().toISOString().slice(0,10);
        if(user.expiry < today) { document.getElementById("loginError").innerText = "❌ License Expired! Contact Admin."; document.getElementById("loginLoading").innerText = ""; return; }
        currentUser = { id: id, name: user.name, role: user.role, expiry: user.expiry };
        localStorage.setItem("currentUser", JSON.stringify(currentUser));
        document.getElementById("loginOverlay").style.display = "none";
        document.getElementById("mainApp").classList.remove("hide-app");
        updateExpiryBadge(currentUser.expiry);
        await openDB();
        await loadAll();
        await loadNotes();
        await syncFromSupabase(true);
        checkBackupReminder();
        document.getElementById("loginLoading").innerText = "";
    }
    
    function checkSavedLogin() {
        let saved = localStorage.getItem("currentUser");
        if(saved) {
            let user = JSON.parse(saved);
            if(user.id === 'hindu') {
                currentUser = user;
                document.getElementById("loginOverlay").style.display = "none";
                document.getElementById("mainApp").classList.remove("hide-app");
                updateExpiryBadge(null);
                openDB().then(() => { loadAll(); loadNotes(); if(supabaseClient) syncFromSupabase(true); checkBackupReminder(); });
                return true;
            }
            let today = new Date().toISOString().slice(0,10);
            if(user.expiry >= today) {
                currentUser = user;
                document.getElementById("loginOverlay").style.display = "none";
                document.getElementById("mainApp").classList.remove("hide-app");
                updateExpiryBadge(currentUser.expiry);
                openDB().then(() => { loadAll(); loadNotes(); if(supabaseClient) syncFromSupabase(true); checkBackupReminder(); });
                return true;
            } else { localStorage.removeItem("currentUser"); }
        }
        return false;
    }
    
    // Auto-sync when app comes to foreground (for mobile)
    document.addEventListener("visibilitychange", () => {
        if(!document.hidden && navigator.onLine && currentUser) {
            console.log("App came to foreground, syncing...");
            syncFromSupabase(false);
        }
    });
    
    // Periodic auto-sync every 2 minutes
    setInterval(() => {
        if(navigator.onLine && currentUser && document.visibilityState === "visible") {
            syncFromSupabase(false);
        }
    }, 120000);
    
    // Pull to refresh on mobile
    let touchStartY = 0;
    let pullToRefreshThreshold = 80;
    let isRefreshing = false;
    
    document.addEventListener('touchstart', (e) => {
        touchStartY = e.touches[0].clientY;
    });
    
    document.addEventListener('touchmove', (e) => {
        let scrollTop = window.scrollY || document.documentElement.scrollTop;
        if(scrollTop === 0 && !isRefreshing && e.touches[0].clientY > touchStartY + pullToRefreshThreshold) {
            isRefreshing = true;
            showToast("🔄 Pull to refresh...");
            syncFromSupabase(true).then(() => {
                setTimeout(() => { isRefreshing = false; }, 1000);
            });
        }
    });
    
    window.onclick = e=>{ if(e.target.classList.contains("modal")) e.target.style.display="none"; };
    document.getElementById("tabCashBtn").onclick = ()=>{ currentActiveTab="cash"; document.getElementById("cashSection").style.display="block"; document.getElementById("loanSection").style.display="none"; document.getElementById("tabCashBtn").classList.add("active"); document.getElementById("tabLoanBtn").classList.remove("active"); };
    document.getElementById("tabLoanBtn").onclick = ()=>{ currentActiveTab="loan"; document.getElementById("cashSection").style.display="none"; document.getElementById("loanSection").style.display="block"; document.getElementById("tabLoanBtn").classList.add("active"); document.getElementById("tabCashBtn").classList.remove("active"); };
    document.getElementById("loginBtn").onclick = checkLogin;
    document.getElementById("loginPassword").addEventListener("keypress", e => { if(e.key === 'Enter') checkLogin(); });
    
    initSupabase();
    if(!checkSavedLogin()) { document.getElementById("loginOverlay").style.display = "flex"; document.getElementById("mainApp").classList.add("hide-app"); }
</script>
</body>
</html>
